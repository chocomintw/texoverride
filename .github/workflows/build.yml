name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # build provenance signing
  attestations: write

# Action versions are the lowest that run on Node 24, which is what the runner now wants.
# Deliberately not the newest majors: checkout v7 changes pull_request_target fork checkout
# defaults, upload-artifact v7 moves to ESM and adds an archive mode, and
# attest-build-provenance v4 is a thin wrapper over actions/attest. None of that buys
# anything here. Re-check with: gh api repos/<action>/contents/action.yml?ref=<tag>
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The gate, the settings parser, the revalidation sweep and ctlPath all have plain
      # assert-style checks in tools/. They only mean anything if they run on every push,
      # so this gates the build: a red test never reaches a release.
      # Proves the vendored MinHook is the upstream commit minhook/UPSTREAM.md names, with
      # hook.c as the only local change. That is what a git submodule would have bought, and it
      # costs nothing at build time: continue-on-error means upstream being unreachable can never
      # block a release, while a real mismatch still shows up loudly in the log.
      - name: Verify vendored MinHook against upstream
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          pin=$(grep -oE '[0-9a-f]{40}' minhook/UPSTREAM.md | head -1)
          echo "UPSTREAM.md pins $pin"
          git clone -q https://github.com/TsudaKageyu/minhook.git /tmp/mh
          git -C /tmp/mh checkout -q "$pin"
          bad=0
          for f in include/MinHook.h src/buffer.c src/buffer.h src/trampoline.c src/trampoline.h src/hde/hde64.c src/hde/hde64.h src/hde/table64.h src/hde/pstdint.h; do
            if diff -q --strip-trailing-cr "/tmp/mh/$f" "minhook/$f" > /dev/null; then
              echo "  ok        $f"
            else
              echo "  MISMATCH  $f"
              bad=1
            fi
          done
          # hook.c is ours: the thread-freeze removal. It must differ, and only there.
          if diff -q --strip-trailing-cr /tmp/mh/src/hook.c minhook/src/hook.c > /dev/null; then
            echo "  UNEXPECTED src/hook.c matches upstream, the freeze removal is gone"
            bad=1
          else
            n=$(diff --strip-trailing-cr /tmp/mh/src/hook.c minhook/src/hook.c | grep -c '^[<>]')
            echo "  ok        src/hook.c differs as expected ($n changed lines)"
          fi
          # Does upstream have newer work on the files we vendor? The check above only proves
          # this copy matches the pin, which says nothing about upstream having moved on. Never
          # fails the build: a newer upstream is information, not a problem.
          git -C /tmp/mh checkout -q master
          ahead=$(git -C /tmp/mh rev-list --count "$pin"..master -- include src ':!src/hook.c')
          if [ "$ahead" = "0" ]; then
            echo "  upstream has nothing newer on the vendored files"
          else
            echo "  upstream has $ahead newer commit(s) touching the vendored files:"
            git -C /tmp/mh log --oneline --no-decorate "$pin"..master -- include src ':!src/hook.c' | sed 's/^/    /'
            echo "  to take them: see the Updating it section of minhook/UPSTREAM.md"
          fi
          hookahead=$(git -C /tmp/mh rev-list --count "$pin"..master -- src/hook.c)
          if [ "$hookahead" != "0" ]; then
            echo "  and $hookahead commit(s) touching hook.c, which is the file we fork:"
            git -C /tmp/mh log --oneline --no-decorate "$pin"..master -- src/hook.c | sed 's/^/    /'
            echo "  re-applying the freeze removal on top of those is a manual job"
          fi
          exit $bad

      - name: Run tests
        shell: cmd
        run: tools\run_tests.bat

      - name: Build
        shell: cmd
        run: build.bat

      # /Brepro makes the linker stamp a content hash instead of a clock, so the same source
      # must produce the same bytes. Building twice and comparing is what turns that from a flag
      # into a guarantee: anyone can build this themselves and check their .asi against the
      # release, which is the whole answer to "is this binary really the source above it".
      - name: Verify reproducible rebuild
        shell: pwsh
        run: |
          $first = (Get-FileHash .\texoverride.asi -Algorithm SHA256).Hash
          & .\build.bat
          if ($LASTEXITCODE -ne 0) { throw "Second build failed with exit code $LASTEXITCODE" }
          $second = (Get-FileHash .\texoverride.asi -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "Build is not reproducible: $first != $second" }
          Write-Host "reproducible: $first"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: texoverride.asi
          path: texoverride.asi

      # The zip is the first-install download: the plugin plus a ready-made tex_overrides with an
      # empty folder per collection, so nobody has to guess or spell a collection name. The bare
      # .asi stays on the release for upgrades, where overwriting somebody's folder would be wrong.
      - name: Pack zip
        shell: pwsh
        run: ./tools/make-zip.ps1

      - name: Upload zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: texoverride.zip
          path: texoverride.zip

      # Free, signed proof that this exact .asi came out of this repo at this commit. Does
      # nothing for antivirus scores, but it turns "trust me, CI built it" into something a
      # player can check: gh attestation verify texoverride.asi --repo <repo>
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            texoverride.asi
            texoverride.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = the top (current) section of CHANGELOG.md
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          {
            echo
            echo '---'
            echo
            echo 'Two downloads. **texoverride.zip** is the one to get if this is your first'
            echo 'time: it holds the plugin and a ready-made `tex_overrides` folder with a'
            echo 'folder already made for every collection you can use. **texoverride.asi** on'
            echo 'its own is for upgrading, so your existing folder is left alone.'
            echo
            echo 'SHA-256:'
            echo
            echo '```'
            sha256sum texoverride.asi texoverride.zip
            echo '```'
            echo
            echo 'Check it was built from this repository, by this commit:'
            echo
            echo '```'
            echo "gh attestation verify texoverride.asi --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" texoverride.zip texoverride.asi --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" texoverride.zip texoverride.asi --clobber
      # Tell BlancoBot a new version is out. blancodagoat.dev already has the whole pipeline:
      # POST a `tool_announce` job, the API pushes it onto Redis, and the gateway bot posts the
      # embed in the announce channel as itself rather than as a raw webhook. So all this has to
      # hand over is the changelog. A fork has no ANNOUNCE_TOKEN and skips, and a failed
      # announcement is a warning rather than a failed build, because by the time this runs the
      # release itself is already published.
      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          ANNOUNCE_TOKEN: ${{ secrets.ANNOUNCE_TOKEN }}
        run: |
          if [ -z "$ANNOUNCE_TOKEN" ]; then
            echo "No ANNOUNCE_TOKEN secret; skipping the announcement."
            exit 0
          fi
          # The embed is a headline list, not the changelog. CHANGELOG.md is written for the
          # release page: every entry leads with what changed and then explains why, wrapped at
          # 100 columns for reading in an editor. Pasted into an embed that came out long, broken
          # at the wrong places, and with the indented sub-paragraphs rendering as loose text
          # between the bullets, so half the list had dots and half did not.
          # First awk: take the current section, drop its heading, join each top-level bullet
          # into one line and throw away the sub-paragraphs. Second awk: keep the first sentence.
          # What is left is one short line per change. The embed title links to the full notes.
          body=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 | awk '
            /^- /            { if (line != "") print line; line = substr($0, 3); inb = 1; next }
            /^[[:space:]]*$/ { if (line != "") { print line; line = "" } inb = 0; next }
                             { if (inb) { sub(/^[[:space:]]+/, ""); line = line " " $0 } }
            END              { if (line != "") print line }
          ' | awk '{ i = index($0, ". "); print "- " (i ? substr($0, 1, i) : $0) }')
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          # Discord caps a description at 4096. Cut early and link out, rather than letting the
          # bot truncate somebody mid-sentence.
          if [ ${#body} -gt 3800 ]; then
            body="${body:0:3800}

          [Read the full changelog]($url)"
          fi
          jq -n --arg t "texoverride $GITHUB_REF_NAME" --arg d "$body" --arg u "$url" '{type:"tool_announce",payload:{title:$t,description:$d,url:$u,color:15575105,footer:"FiveM client-side clothing, weapon and animation overrides"}}' > announce.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://blancodagoat.dev/api/enqueue-discord-job -H "Authorization: Bearer $ANNOUNCE_TOKEN" -H 'Content-Type: application/json' --data @announce.json)
          echo "enqueue-discord-job: HTTP $code $(cat resp.txt)"
          test "$code" = "200"
